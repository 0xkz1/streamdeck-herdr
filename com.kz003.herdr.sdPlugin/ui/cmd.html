<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
</head>
<body>
<sdpi-item label="機能">
  <sdpi-select setting="cmd" placeholder="選んでください">
    <optgroup label="BGM">
      <option value="music-info">ℹ️ 再生中の曲 (曲名・作者・残り時間 / 押して開く)</option>
      <option value="music-play">⏯ 再生 / 一時停止 (トグル)</option>
      <option value="music-prev">⏮ 前の曲へ戻る</option>
      <option value="music-next">⏭ 次の曲へスキップ</option>
      <option value="music-vol-up">🔊 BGM 音量 +10%</option>
      <option value="music-vol-down">🔉 BGM 音量 -10%</option>
      <option value="music-acid">🌀 Acid Pauli (DJ Sets & Mixes)</option>
      <option value="music-soundtrack">🎬 映画音楽 (Soundtrack / OST)</option>
      <option value="music-long">🎯 長尺BGM (作業用Mix・セット)</option>
      <option value="music-short">🎵 短曲 (10分未満)</option>
      <option value="music-chill">☕ チル・静か (Ambient / Lo-Fi)</option>
      <option value="music-upbeat">⚡ 気分転換 (テンポ良い曲)</option>
      <option value="music-focus">🎧 作業没入 (長尺アンビエント)</option>
      <option value="music-toggle">🎲 全曲BGM (いいね全曲シャッフル)</option>
      <option value="music-sync">🔄 SoundCloud いいね更新</option>
    </optgroup>
    <optgroup label="使用上限">
      <option value="limit-handoff">⚠️ 上限で止まった → もう一方へ引き継ぎ</option>
      <option value="agy-rotate">🔄 AGY アカウント切替 (次のGoogle垢へ)</option>
    </optgroup>
    <optgroup label="全セッションの巡回">
      <option value="patrol-now">まとめて進める — 優先順に再開</option>
    </optgroup>
    <optgroup label="自動運転">
      <option value="drive-away">🌙 60分離席 — 5分ごとに巡回 / 通常運転へ戻す</option>
      <option value="drive-toggle">🚦 自動運転 ON / OFF</option>
      <option value="drive-report">📋 帰席レポート — 変更・検証・必要な判断</option>
      <option value="q-queue">📚 残りをキューへ — 合意済みの未完了作業を登録</option>
    </optgroup>
    <optgroup label="選択中のエージェントへ送る">
      <option value="q-continue">⏩ 続けて</option>
      <option value="q-diff">🔍 diff を見せて要約</option>
      <option value="q-test">🧪 テストを実行</option>
      <option value="q-commit">💾 コミット(push しない)</option>
      <option value="q-where">🧭 状況整理(いま何をしている?)</option>
      <option value="q-leftover">🧹 やり残し確認(閉じる前に)</option>
      <option value="q-esc">⏹ 中断(Esc)</option>
      <option value="clip">📋 クリップボードを送る</option>
      <option value="shot">📸 画面の範囲を撮って送る</option>
    </optgroup>
    <optgroup label="音声・入力">
      <option value="voice">🎤 音声入力(押している間だけ録音)</option>
      <option value="enter">⏎ 送信(Enter)</option>
      <option value="hue-voice">💡 声で Hue(コンピュータールーム)</option>
    </optgroup>
    <optgroup label="検索・移動">
      <option value="navigator">🔎 Navigator(タブ・セッションを探す)</option>
    </optgroup>
    <optgroup label="ペイン操作(Ctrl+B 不要)">
      <option value="split-right">◧ 右に分割</option>
      <option value="split-down">⬓ 下に分割</option>
      <option value="zoom">🔍 ズーム(切替)</option>
      <option value="focus-left">◀ 左のペインへ</option>
      <option value="focus-right">▶ 右のペインへ</option>
      <option value="focus-up">🔼 上のペインへ</option>
      <option value="focus-down">🔽 下のペインへ</option>
    </optgroup>
    <optgroup label="Hermes cron を今すぐ実行">
      <option value="cron-morning-brief">☀️ 朝ブリーフ</option>
    </optgroup>
    <optgroup label="Hue(ワンタッチ。中身は presets.json で変えられる)">
      <option value="hue-ambient">💡 エージェント状態ライト(ON/OFF)</option>
      <option value="hue-p-focus">🎯 集中</option>
      <option value="hue-p-relax">😌 リラックス</option>
      <option value="hue-p-warm">🔥 暖かく</option>
      <option value="hue-p-cool">❄️ 涼しく</option>
      <option value="hue-p-read">📖 読書</option>
      <option value="hue-p-night">🌙 夜</option>
      <option value="hue-p-energize">⚡ 元気</option>
    </optgroup>
    <optgroup label="引き継ぎ(組・向き自動・長押しで実行)">
      <option value="pair-claude-codex">🔀 Claude ⇄ Codex</option>
      <option value="pair-claude-hermes">🔀 Claude ⇄ Hermes</option>
      <option value="pair-claude-opencode">🔀 Claude ⇄ OpenCode</option>
      <option value="pair-claude-agy">🔀 Claude ⇄ Antigravity</option>
    </optgroup>
    <optgroup label="引き継ぎ(一方向・押すとすぐ実行)">
      <option value="handoff-claude">🔀 → Claude</option>
      <option value="handoff-codex">🔀 → Codex</option>
      <option value="handoff-hermes">🔀 → Hermes</option>
      <option value="handoff-opencode">🔀 → OpenCode</option>
      <option value="handoff-agy">🔀 → Antigravity</option>
    </optgroup>
    <optgroup label="引き継ぎ(役割・押すとすぐ実行)">
      <option value="handoff-builder">🔀 → Builder</option>
      <option value="handoff-review-editor">🔀 → Review</option>
      <option value="handoff-strategist">🔀 → Strategist</option>
      <option value="handoff-researcher">🔀 → Researcher</option>
      <option value="handoff-writer">🔀 → Writer</option>
      <option value="handoff-visualizer">🔀 → Visualizer</option>
    </optgroup>
    <optgroup label="作業中の音">
      <option value="mute-toggle">🔇 Herdr 全消音 ON/OFF</option>
      <option value="think-toggle">🎲 考え中の音(コロコロ)ON/OFF</option>
    </optgroup>
    <optgroup label="作業中の時計(旧案・初期はOFF)">
      <option value="tick-toggle">🕰 作業中の時計 ON/OFF</option>
      <option value="tick-switch">🔁 時計を替える(柱時計→置き時計→台所)</option>
    </optgroup>
    <optgroup label="会議・使用量">
      <option value="scribe">🎙 会議の字幕(開始/停止)</option>
      <option value="gpu">🖥 GPU 温度・使用率・電力</option>
      <option value="cpu">🧠 CPU 温度・使用率</option>
      <option value="alerts">🚨 アラート(発火中の件数・押すと内容)</option>
      <option value="mem">🧮 メモリ・VRAM</option>
      <option value="disk">💾 ディスク残量・NVMe温度</option>
      <option value="plimit">🛡 GPU電力制限 切替(250W⇔360W)</option>
      <option value="usage">📊 Claude 使用量(週/5時間)</option>
    </optgroup>
    <optgroup label="基盤">
      <option value="infra">🏥 基盤の状態(押すと修復)</option>
    </optgroup>
  </sdpi-select>
</sdpi-item>
</body>
</html>
